<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>FinControl - Controle Financeiro Pessoal</title>

    <!-- SEO & Basic Meta -->
    <meta name="description" content="Aplicativo para controle financeiro pessoal." />
    <meta name="keywords" content="finanças, controle financeiro, gestão financeira, orçamento, contas, cartões, fincontrol, pwa" />
    <meta name="author" content="FinControl" />
    <meta name="application-name" content="FinControl" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinControl - Controle Financeiro Pessoal" />
    <meta property="og:description" content="Aplicativo para controle financeiro pessoal." />
    <meta property="og:site_name" content="FinControl" />

    <!-- PWA & Theme Colors -->
    <meta name="theme-color" content="#00C7C7" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinControl" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Microsoft Windows Meta Tags -->
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="/mstile-150x150.png" />

    <!-- Favicons & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="mask-icon" href="/maskable-icon-512x512.png" color="#00C7C7" />

    <!-- Web Application Manifest (Corrigido de .webmanifest para .json) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Script obrigatório para registrar o Service Worker e habilitar instalação no Android -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((reg) => console.log('SW registrado:', reg.scope))
            .catch((err) => console.error('Erro ao registrar SW:', err));
        });
      }
    </script>
  </body>
</html>
